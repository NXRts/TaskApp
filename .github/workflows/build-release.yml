name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="v2.3.0"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "TaskApp-${VERSION}.apk"

      - name: Upload APK Artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: TaskApp-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Prepare Release Notes
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -f "RELEASE_NOTES_${VERSION}.md" ]; then
            cp "RELEASE_NOTES_${VERSION}.md" RELEASE_NOTES_CURRENT.md
          elif [ -f "RELEASE_NOTES.md" ]; then
            cp "RELEASE_NOTES.md" RELEASE_NOTES_CURRENT.md
          elif [ -f "RELEASE_NOTES_v2.2.0.md" ]; then
            cp "RELEASE_NOTES_v2.2.0.md" RELEASE_NOTES_CURRENT.md
          elif [ -f "RELEASE_NOTES_v2.0.6.md" ]; then
            cp "RELEASE_NOTES_v2.0.6.md" RELEASE_NOTES_CURRENT.md
          else
            echo "TaskApp ${VERSION}" > RELEASE_NOTES_CURRENT.md
          fi

      - name: Upload Release Asset (GitHub Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TaskApp ${{ github.ref_name }} — Modern Editorial Productivity & Academic Planner"
          body_path: RELEASE_NOTES_CURRENT.md
          draft: false
          prerelease: false
          files: |
            TaskApp-*.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
